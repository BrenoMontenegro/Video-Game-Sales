<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Upload de Dataset</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      color: #fff;
      overflow-x: hidden;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 15px;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .container-info {
      display: block;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      height: 100%;
    }

    .container-submit {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      padding: 1rem;
      gap: 15px;
      height: 100%;
    }

    .box {
      background-color: rgba(0, 0, 0, 0.3);
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      height: 100%;
      width: 100%;
    }

    input[type="file"] {
      margin-top: 20px;
      padding: 10px;
    }

    button {
      margin-top: 20px;
      padding: 10px 30px;
      font-size: 16px;
      background-color: #fff;
      color: #333;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }

    button:hover {
      background-color: #ddd;
      scale: 1.1;
    }

    .result {
      margin-top: 30px;
      white-space: pre-wrap;
      text-align: left;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .text-info {
      font-size: 13px;
      color: #e7e7e7;

    }

    .file-upload {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: Arial, sans-serif;
    }

    .file-input {
      display: none;
      /* Esconde o input padrão */
    }

    .file-label {
      background-color: #fff;
      color: #333;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }

    .file-label:hover {
      background-color: #ddd;
      scale: 1.1;
    }

    .file-name {
      font-size: 0.9rem;
      color: #333;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1rem;
      margin-top: 1rem;
      gap: 10px;
      font-family: Arial, sans-serif;
    }

    label {
      font-weight: bold;
      margin-bottom: 0.4rem;
      color: #333;
    }

    .input-text {
      padding: 8px 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      background-color: #fff;
      color: #222;
    }

    .input-text:focus {
      border-color: #004aad;
      box-shadow: 0 0 0 2px rgba(0, 74, 173, 0.2);
    }
  </style>
</head>

<body>
  <main>
    <div class="container-info">
      <div class="box">
        <h1>Instruções</h1>
        <p class="text-info">O csv deve conter as seguintes colunas (Plataform, Genre e Year) nesta mesma sequência.</p>
      </div>
    </div>
    <div class="container-submit">
      <div class="box">
        <h1>Digite os dados</h1>
        <p class="text-info">Digite os dados e veja a predição do modelo.</p>
        <div class="form-group">
          <label for="genre">
            Genêro
          </label>
          <input class="input-text" type="text" name="genre" id="genre-input">
          <label for="plataform">
            Plataforma
          </label>
          <input class="input-text" type="text" name="plataform" id="plataform-input">
          <label for="year">
            Ano de Lançamento
          </label>
          <input class="input-text" type="text" name="year" id="year-input">
          <button onclick="" type="submit">Enviar e ver Previsões</button>
        </div>
        <div class="result" id="result-input"></div>
      </div>
      <div class="box">
        <h1>Faça o Upload aqui</h1>
        <p class="text-info">Escolha e envie o csv para predição.</p>
        <div class="file-upload">
          <label for="fileInput" class="file-label">
            Escolher arquivo
          </label>
          <input type="file" id="fileInput" class="file-input">
          <span id="file-name" class="file-name">Nenhum arquivo selecionado</span>
        </div>
        <br>
        <button onclick="enviarArquivo()">Enviar e Ver Previsões</button>
        <div class="result" id="result-csv"></div>
      </div>
    </div>
  </main>


  <script>
    const input = document.getElementById('fileInput');
    const fileName = document.getElementById('file-name');

    // exibe o nome do arquivo
    input.addEventListener('change', function () {
      if (input.files.length > 0) {
        fileName.textContent = input.files[0].name;
      } else {
        fileName.textContent = "Nenhum arquivo selecionado";
      }
    });



    function enviarArquivo() {
      const file = input.files[0];

      if (!file) {
        alert("Por favor, selecione um arquivo .csv.");
        return;
      }

      const formData = new FormData();
      formData.append("arquivo", file);

      fetch("http://localhost:5001/predict", {
        method: "POST",
        body: formData
      })
        .then(resp => resp.json())
        .then(data => {
          const resultDiv = document.getElementById("result");
          resultDiv.innerText = JSON.stringify(data, null, 2);
        })
        .catch(error => {
          alert("Erro ao enviar o arquivo.");
          console.error(error);
        });
    }
  </script>

</body>

</html>
