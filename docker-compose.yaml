services:
  ml_app:
    build: 
      context: ./all-models-mlflow
      dockerfile: Dockerfile
    container_name: ml_app
    volumes:
      - ./mlruns:/app/mlruns
      - ./dados:/app/dados
    environment:
      - MLFLOW_TRACKING_URI=file:/app/mlruns
    command: python videogame.py

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    depends_on:
      - ml_app
    environment:
      - MLFLOW_BACKEND_STORE_URI=/mlflow/mlruns
    command: mlflow ui --backend-store-uri /mlflow/mlruns --host 0.0.0.0 --port 5000
  
  mlflow-best-model:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_best_model
    ports:
      - "5001:5001"
    depends_on:
      - ml_app
    volumes:
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_BACKEND_STORE_URI=/mlflow/mlruns
    command: mlflow models serve -m /app/mlruns/0/a8dd4d845f504d88a66953bc62d2f48a/artifacts/MLP_model --host 0.0.0.0 --port 5001

